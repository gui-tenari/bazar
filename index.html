<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bazar da Mudança</title>
<meta name="description" content="Tudo à venda antes da mudança. Reserve pelo site.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf8f4; --surface:#fff; --ink:#1f1d1a; --muted:#6f6a62; --line:#e7e2d9;
  --accent:#2f5d50; --accent-ink:#fff; --accent-soft:#e6efeb;
  --warn:#9a5b13; --warn-soft:#fbefdc; --sold:#8a8580; --sold-soft:#efedea;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{padding:56px 0 28px}
h1{font:600 clamp(34px,6vw,54px)/1.05 Fraunces,Georgia,serif;letter-spacing:-.02em;margin:0 0 14px}
.sub{color:var(--muted);max-width:620px;margin:0;font-size:17px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:28px 0 0;font-size:14.5px}
.notice svg{flex:none;margin-top:2px;color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:32px 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px Inter,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.toggle{flex-direction:row;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.count{font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;padding-bottom:64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ph{position:relative;aspect-ratio:1/1;background:#eee9e0;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:12px;left:12px;font:600 12px Inter,sans-serif;letter-spacing:.02em;padding:5px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.badge.res{background:var(--warn-soft);color:var(--warn)}
.badge.sold{background:var(--sold-soft);color:var(--sold)}
.card.is-sold .ph img{filter:grayscale(1);opacity:.55}
.body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-weight:600;font-size:16.5px;margin:0}
.price{font:600 20px Fraunces,Georgia,serif}
.price.soft{font:600 15px Inter,sans-serif;color:var(--accent)}
.meta{font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.btn{appearance:none;border:0;border-radius:10px;padding:12px 16px;font:600 15px Inter,sans-serif;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.alt{background:var(--warn-soft);color:var(--warn)}
.btn[disabled]{background:var(--sold-soft);color:var(--sold);cursor:not-allowed}
.card .btn{margin-top:auto}
.card .spacer{flex:1;min-height:8px}
.state{padding:60px 0;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:13.5px}

/* modal */
dialog{border:0;padding:0;border-radius:18px;max-width:880px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(25,22,18,.55)}
.m{display:grid;grid-template-columns:1.05fr 1fr}
.m-media{background:#eee9e0;position:relative;min-height:460px}
.m-media>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumbs{position:absolute;bottom:12px;left:12px;display:flex;gap:6px}
.thumbs button{width:44px;height:44px;border-radius:8px;border:2px solid #fff;padding:0;overflow:hidden;cursor:pointer;opacity:.75;background:#ddd}
.thumbs button[aria-current=true]{opacity:1;border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.m-info{padding:28px 26px;display:flex;flex-direction:column;gap:10px;max-height:85vh;overflow:auto}
.close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:20px;cursor:pointer;z-index:2}
.m-info h2{font:600 26px/1.15 Fraunces,Georgia,serif;margin:0}
.desc{margin:0;color:var(--ink)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:6px 0;font-size:14px}
dt{color:var(--muted)} dd{margin:0}
form{display:flex;flex-direction:column;gap:10px;margin-top:8px;border-top:1px solid var(--line);padding-top:16px}
form h3{margin:0;font-size:15px}
label{font-size:13px;font-weight:500;display:flex;flex-direction:column;gap:4px;min-width:0}
.toggle input{width:auto}
.inline{position:static;display:inline-block}
input,textarea{min-width:0;width:100%;font:15px Inter,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:60px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.fine{font-size:12px;color:var(--muted);margin:0}
.msg{font-size:14px;padding:12px 14px;border-radius:10px;margin:0}
.msg.ok{background:var(--accent-soft);color:var(--accent)}
.msg.err{background:#fbe5e2;color:#9b2c1f}
.queue{font-size:13.5px;color:var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:9px;margin:0}

@media (max-width:720px){
  header{padding:36px 0 20px}
  .m{grid-template-columns:1fr}
  .m-media{min-height:0}
  .m-media>img{position:static;height:auto;aspect-ratio:1/1;max-height:52vh}
  .m-info{max-height:none;padding:22px 18px}
  dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:94vh;overflow:auto}
  .row{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .body{padding:12px}
  .name{font-size:14.5px}
  .price{font-size:17px}
  .meta{font-size:12.5px}
  .btn{padding:10px 12px;font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="titulo">Bazar da Mudança</h1>
    <p class="sub" id="subtitulo"></p>
    <div class="notice">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
      <div><strong>Retirada em <span id="cidade">Taboão da Serra/SP</span>.</strong> O transporte fica por conta do comprador. Cada item tem uma data a partir da qual pode ser retirado.</div>
    </div>
  </header>

  <div class="toolbar">
    <div class="chips" role="group" aria-label="Filtrar">
      <button class="chip" data-f="todos" aria-pressed="true">Todos</button>
      <button class="chip" data-f="preco" aria-pressed="false">À venda</button>
      <button class="chip" data-f="negociacao" aria-pressed="false">Negociável</button>
      <button class="chip" data-f="doacao" aria-pressed="false">Doação</button>
    </div>
    <label class="toggle"><input type="checkbox" id="hideSold"> Ocultar vendidos</label>
  </div>
  <p class="count" id="count"></p>

  <main class="grid" id="grid" aria-live="polite"><div class="state">Carregando itens…</div></main>
</div>
<footer><div class="wrap">Reservas são confirmadas por contato direto. Seus dados são usados apenas para combinar a venda e não são compartilhados.</div></footer>

<dialog id="dlg" aria-labelledby="mTitle"></dialog>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const grid = $('#grid'), dlg = $('#dlg');
  let CONFIG = {}, ITEMS = [], RES = {}, filter = 'todos';

  const brl = n => n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: n % 1 ? 2 : 0 });
  const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const parseDate = s => { const [y,m,d] = String(s||'').split('-').map(Number); return y ? new Date(y, m-1, d) : null; };
  const fmtDate = d => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function statusOf(it) {
    if (it.status === 'vendido') return 'vendido';
    if (it.status === 'reservado' || (RES[it.id] || 0) > 0) return 'reservado';
    return 'disponivel';
  }
  function priceHtml(it) {
    if (it.tipo === 'doacao') return '<span class="price soft">Doação</span>';
    if (it.tipo === 'negociacao' || it.preco == null) return '<span class="price soft">Aberto a negociação</span>';
    return `<span class="price">${brl(Number(it.preco))}</span>`;
  }
  function availText(it) {
    const d = parseDate(it.disponivelAPartirDe);
    if (!d || d <= today()) return 'Retirada: já disponível';
    return 'Retirada a partir de ' + fmtDate(d);
  }
  function boughtText(it) {
    const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    const [y, m] = String(it.compradoEm || '').split('-').map(Number);
    const when = y ? `em ${meses[(m || 1) - 1]}/${y}` : '';
    const paid = it.precoOriginal ? `novo por ${brl(Number(it.precoOriginal))}` : '';
    return [when, paid].filter(Boolean).join(', ');
  }
  const badge = (st, x = '') => st === 'vendido' ? `<span class="badge sold ${x}">Vendido</span>`
    : st === 'reservado' ? `<span class="badge res ${x}">Reservado</span>` : `<span class="badge ${x}">Disponível</span>`;
  const btnLabel = st => st === 'vendido' ? 'Vendido' : st === 'reservado' ? 'Entrar na fila' : 'Reservar item';

  function render() {
    const hide = $('#hideSold').checked;
    const order = { disponivel: 0, reservado: 1, vendido: 2 };
    const list = ITEMS
      .filter(it => filter === 'todos' || (filter === 'negociacao' ? (it.tipo === 'negociacao' || (it.tipo !== 'doacao' && it.preco == null)) : it.tipo === filter))
      .filter(it => !(hide && statusOf(it) === 'vendido'))
      .sort((a, b) => order[statusOf(a)] - order[statusOf(b)]);
    const avail = ITEMS.filter(it => statusOf(it) !== 'vendido').length;
    $('#count').textContent = `${avail} de ${ITEMS.length} itens ainda disponíveis`;
    if (!list.length) { grid.innerHTML = '<div class="state">Nenhum item neste filtro.</div>'; return; }
    grid.innerHTML = list.map(it => {
      const st = statusOf(it);
      return `<article class="card ${st === 'vendido' ? 'is-sold' : ''}" tabindex="0" data-id="${esc(it.id)}" aria-label="${esc(it.nome)}">
        <div class="ph"><img src="${esc((it.fotos||[])[0] || '')}" alt="${esc(it.nome)}" loading="lazy">${badge(st)}</div>
        <div class="body">
          <h2 class="name">${esc(it.nome)}</h2>
          ${priceHtml(it)}
          <div class="meta"><span>Estado: ${esc(it.estado || '—')}</span><span>${availText(it)}</span></div>
          <div class="spacer"></div>
          <button class="btn ${st === 'reservado' ? 'alt' : ''}" ${st === 'vendido' ? 'disabled' : ''} tabindex="-1">${btnLabel(st)}</button>
        </div></article>`;
    }).join('');
  }

  function openItem(id) {
    const it = ITEMS.find(x => x.id === id); if (!it) return;
    const st = statusOf(it), n = RES[it.id] || 0, fotos = it.fotos || [];
    const negotiable = it.tipo === 'negociacao' || (it.tipo !== 'doacao' && it.preco == null);
    dlg.innerHTML = `<div class="m">
      <div class="m-media"><button class="close" aria-label="Fechar">×</button>
        <img id="mImg" src="${esc(fotos[0]||'')}" alt="${esc(it.nome)}">
        ${fotos.length > 1 ? `<div class="thumbs">${fotos.map((f,i) => `<button data-src="${esc(f)}" aria-current="${i===0}" aria-label="Foto ${i+1}"><img src="${esc(f)}" alt=""></button>`).join('')}</div>` : ''}
      </div>
      <div class="m-info">
        <div>${badge(st, 'inline')}</div>
        <h2 id="mTitle">${esc(it.nome)}</h2>
        ${priceHtml(it)}
        ${it.descricao ? `<p class="desc">${esc(it.descricao)}</p>` : ''}
        <dl><dt>Estado</dt><dd>${esc(it.estado || '—')}</dd><dt>Retirada</dt><dd>${availText(it).replace('Retirada: ','').replace('Retirada a partir','A partir')} · ${esc(CONFIG.cidade || '')}</dd><dt>Transporte</dt><dd>Por conta do comprador</dd>${boughtText(it) ? `<dt>Comprado</dt><dd>${boughtText(it)}</dd>` : ''}</dl>
        ${st === 'vendido' ? '<p class="msg err" style="background:var(--sold-soft);color:var(--sold)">Este item já foi vendido.</p>' : `
        <form id="f" novalidate>
          <h3>${st === 'reservado' ? 'Entrar na fila de espera' : 'Reservar este item'}</h3>
          ${st === 'reservado' ? `<p class="queue">Este item já tem ${n > 1 ? n + ' reservas' : 'uma reserva'}. Se ${n > 1 ? 'elas não forem' : 'ela não for'} adiante, eu entro em contato com o próximo da fila.</p>` : ''}
          <label>Nome<input name="nome" required autocomplete="name" maxlength="100"></label>
          <div class="row">
            <label>Email<input name="email" type="email" required autocomplete="email" maxlength="120"></label>
            <label>Telefone / WhatsApp<input name="telefone" type="tel" required autocomplete="tel" placeholder="(11) 90000-0000" maxlength="20"></label>
          </div>
          ${negotiable ? '<label>Sua oferta (R$, opcional)<input name="oferta" inputmode="decimal" placeholder="Ex.: 300" maxlength="12"></label>' : ''}
          <label>Mensagem (opcional)<textarea name="mensagem" maxlength="500"></textarea></label>
          <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
          <button class="btn ${st === 'reservado' ? 'alt' : ''}" type="submit">${st === 'reservado' ? 'Entrar na fila' : 'Confirmar reserva'}</button>
          <p class="fine">Seus dados são usados apenas para combinar esta venda. A reserva não envolve pagamento pelo site.</p>
          <div id="fmsg"></div>
        </form>`}
      </div></div>`;
    dlg.querySelector('.close').onclick = () => dlg.close();
    dlg.querySelectorAll('.thumbs button').forEach(b => b.onclick = () => {
      $('#mImg').src = b.dataset.src;
      dlg.querySelectorAll('.thumbs button').forEach(x => x.setAttribute('aria-current', x === b));
    });
    const f = dlg.querySelector('#f'); if (f) { f.onsubmit = e => submit(e, it); maskPhone(f.telefone); }
    dlg.showModal();
  }

  function maskPhone(inp) {
    inp.addEventListener('input', () => {
      let d = inp.value.replace(/\D/g, '').slice(0, 11);
      if (d.length > 6) inp.value = `(${d.slice(0,2)}) ${d.slice(2, d.length - 4)}-${d.slice(-4)}`;
      else if (d.length > 2) inp.value = `(${d.slice(0,2)}) ${d.slice(2)}`;
      else inp.value = d;
    });
  }

  async function submit(e, it) {
    e.preventDefault();
    const f = e.target, out = f.querySelector('#fmsg'), btn = f.querySelector('button[type=submit]');
    const data = Object.fromEntries(new FormData(f));
    const show = (cls, t) => out.innerHTML = `<p class="msg ${cls}">${esc(t)}</p>`;
    if (!data.nome.trim()) return show('err', 'Informe seu nome.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) return show('err', 'Informe um email válido.');
    if (data.telefone.replace(/\D/g, '').length < 10) return show('err', 'Informe o telefone com DDD.');
    if (!CONFIG.reservasUrl) return show('err', 'As reservas ainda não estão ativas. Volte em breve!');
    btn.disabled = true; btn.textContent = 'Enviando…';
    try {
      const r = await fetch(CONFIG.reservasUrl, { method: 'POST', body: JSON.stringify({ ...data, itemId: it.id, itemNome: it.nome }) });
      const j = await r.json();
      if (!j.ok) throw new Error(j.erro || 'Não foi possível reservar.');
      if (!j.duplicada) RES[it.id] = (RES[it.id] || 0) + 1;
      f.innerHTML = `<p class="msg ok"><strong>${j.posicao == 1 ? 'Reserva recebida!' : 'Você está na fila!'}</strong><br>${
        j.duplicada ? 'Você já tinha reservado este item. ' : ''}${
        j.posicao == 1 ? 'O item está reservado para você. Vou entrar em contato pelo WhatsApp ou email para combinar a retirada.'
                       : `Sua posição na fila é ${j.posicao}. Se as reservas anteriores não forem adiante, eu entro em contato com você.`}</p>`;
      render();
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Tentar novamente';
      show('err', err.message && !/fetch|JSON|network/i.test(err.message) ? err.message : 'Falha de conexão. Tente novamente em instantes.');
    }
  }

  grid.addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openItem(c.dataset.id); });
  grid.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) { e.preventDefault(); openItem(e.target.dataset.id); } });
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    filter = c.dataset.f;
    document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c));
    render();
  });
  $('#hideSold').onchange = render;

  async function load() {
    let db;
    try {
      const r = await fetch('assets/items.json?v=' + Date.now());
      db = await r.json();
    } catch (e) {
      grid.innerHTML = '<div class="state">Não foi possível carregar o catálogo. Se você é o dono, confira se o <code>items.json</code> está com o formato correto (vírgulas e aspas).</div>';
      return;
    }
    CONFIG = db.config || {}; ITEMS = db.items || [];
    if (CONFIG.titulo) { $('#titulo').textContent = CONFIG.titulo; document.title = CONFIG.titulo; }
    $('#subtitulo').textContent = CONFIG.subtitulo || '';
    if (CONFIG.cidade) $('#cidade').textContent = CONFIG.cidade;
    render();
    if (CONFIG.reservasUrl) {
      try {
        const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 8000);
        const j = await (await fetch(CONFIG.reservasUrl, { signal: ctrl.signal })).json();
        clearTimeout(t);
        if (j.ok) { RES = j.reservas || {}; render(); }
      } catch (e) { /* sem conexão com o Apps Script: mostra status do JSON */ }
    }
  }
  load();
})();
</script>
</body>
</html>
